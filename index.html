<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZENI LIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111315;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 56px 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 28px;
      border-bottom: 1px solid #30343a;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 3px;
      font-weight: 650;
    }

    .brand p {
      margin: 8px 0 0;
      color: #8e959d;
      font-size: 14px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aeb4ba;
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #73806f;
    }

    .intro {
      margin: 70px 0 45px;
    }

    .intro h2 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      font-weight: 600;
      letter-spacing: -2px;
    }

    .intro p {
      margin-top: 16px;
      color: #8e959d;
      font-size: 16px;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      background: #181b1f;
      border: 1px solid #30343a;
      border-radius: 12px;
      padding: 24px;
    }

    .label {
      color: #7f878f;
      font-size: 12px;
      letter-spacing: 1.5px;
    }

    .value {
      margin-top: 14px;
      font-size: 20px;
      font-weight: 600;
    }

    .ok {
      color: #9caf9a;
    }

    .offline {
      color: #a8a8a8;
    }

    footer {
      margin-top: 70px;
      padding-top: 20px;
      border-top: 1px solid #30343a;
      color: #676e75;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .container {
        padding-top: 32px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .intro {
        margin-top: 48px;
      }

      header {
        align-items: flex-start;
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="brand">
        <h1>ZENI LIVE</h1>
        <p>Trading Automation Monitor</p>
      </div>

      <div class="live">
        <span class="dot"></span>
        MONITOR
      </div>
    </header>

    <section class="intro">
      <h2>System Monitor</h2>
      <p>
        Real-time monitoring interface for the Zeni trading automation system.
      </p>
    </section>

    <section class="grid">

      <div class="card">
        <div class="label">WEB STATUS</div>
        <div class="value ok">ONLINE</div>
      </div>

      <div class="card">
        <div class="label">ZENI M1</div>
        <div id="zeni-status" class="value offline">NOT CONNECTED</div>
      </div>

      <div class="card">
        <div class="label">DATA LINK</div>
        <div id="data-link" class="value offline">NOT CONNECTED</div>
      </div>

    </section>

    <footer>
      ZENI LIVE · GitHub Pages deployment test
    </footer>

  </main>

    <script>
      const ZENI_API_BASE = "https://potentially-timber-louise-copied.trycloudflare.com";

      async function refreshZeniStatus() {
        const zeni = document.getElementById("zeni-status");
        const dataLink = document.getElementById("data-link");

        try {
          const response = await fetch(
            `${ZENI_API_BASE}/api/status`,
            { cache: "no-store" }
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const status = await response.json();

          if (status.status === "online") {
            zeni.textContent = "ONLINE";
            zeni.classList.remove("offline");
          } else {
            zeni.textContent = "NOT CONNECTED";
            zeni.classList.add("offline");
          }

          if (status.trading_data_connected === true) {
            dataLink.textContent = "CONNECTED";
            dataLink.classList.remove("offline");
          } else {
            dataLink.textContent = "NOT CONNECTED";
            dataLink.classList.add("offline");
          }
        } catch (error) {
          zeni.textContent = "NOT CONNECTED";
          zeni.classList.add("offline");
          dataLink.textContent = "NOT CONNECTED";
          dataLink.classList.add("offline");
        }
      }

      refreshZeniStatus();
      setInterval(refreshZeniStatus, 10000);
    </script>
  </body>
</html>
